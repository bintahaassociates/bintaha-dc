<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Taha Mobeen Bhutta - Bin Taha Associates | Official Digital Card</title>
  
  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root {
      --gold-primary: #f2c94c;
      --gold-light: #fff3b0;
      --gold-dark: #b8860b;
      --gold-foil: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
      --card-bg: rgba(6, 10, 20, 0.92);
      --glass-border: rgba(242, 201, 76, 0.35);
      --neon-glow: 0 0 60px rgba(212, 175, 55, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #030712;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 14px;
      overflow-x: hidden;
      position: relative;
    }

    /* Outer Moving Background Shapes */
    .bg-animated-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #0c152a 0%, #030712 100%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.25;
      animation: floatOrbs 12s infinite alternate ease-in-out;
    }
    .orb-1 { width: 300px; height: 300px; background: #f2c94c; top: -10%; left: -10%; }
    .orb-2 { width: 350px; height: 350px; background: #1e3a8a; bottom: -10%; right: -10%; animation-delay: -4s; }

    @keyframes floatOrbs {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 50px) scale(1.15); }
    }

    .bg-architecture-shade {
      position: absolute;
      inset: 0;
      background-image: url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1200&q=80');
      background-size: cover;
      background-position: center;
      opacity: 0.07;
      mix-blend-mode: luminosity;
      animation: subtleZoom 25s infinite alternate ease-in-out;
    }

    @keyframes subtleZoom {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    .golden-text {
      background: var(--gold-foil);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Card Wrapper */
    .card-wrapper {
      width: 100%;
      max-width: 420px;
      border-radius: 38px;
      padding: 2.5px;
      background: linear-gradient(145deg, rgba(242, 201, 76, 0.85), rgba(30, 41, 59, 0.4), rgba(242, 201, 76, 0.6));
      box-shadow: 0 35px 80px rgba(0, 0, 0, 0.95), var(--neon-glow);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      z-index: 1;
    }

    .card-wrapper:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 45px 100px rgba(0, 0, 0, 0.98), 0 0 80px rgba(242, 201, 76, 0.4);
    }

    /* Card Body */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      border-radius: 36px;
      padding: 36px 24px 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(242, 201, 76, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(242, 201, 76, 0.03) 1px, transparent 1px);
      background-size: 30px 30px;
      animation: gridMove 20s linear infinite;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes gridMove {
      0% { background-position: 0 0; }
      100% { background-position: 30px 30px; }
    }

    .card > * {
      position: relative;
      z-index: 1;
    }

    @keyframes eaglePulse {
      0% { filter: drop-shadow(0 0 10px rgba(242, 201, 76, 0.4)); }
      50% { filter: drop-shadow(0 0 25px rgba(242, 201, 76, 0.9)); }
      100% { filter: drop-shadow(0 0 10px rgba(242, 201, 76, 0.4)); }
    }

    .logo-frame-wrapper {
      position: relative;
      width: 140px;
      height: 140px;
      margin: 0 auto 18px;
      animation: eaglePulse 4s infinite ease-in-out;
    }

    .logo-frame-outer {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: var(--gold-foil);
      padding: 3px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8), 0 0 25px rgba(242, 201, 76, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-frame-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #060913;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .logo-frame-inner img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 5px 12px rgba(0,0,0,0.9)) contrast(1.15);
    }

    .user-name {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 1.2px;
      margin-bottom: 4px;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.7));
    }

    .brand-tagline {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 24px;
    }

    .primary-actions {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .action-btn {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 12px 4px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }

    .action-btn .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: rgba(242, 201, 76, 0.1);
      border: 1px solid rgba(242, 201, 76, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .action-btn i {
      font-size: 16px;
      color: var(--gold-primary);
    }

    .action-btn span {
      background: var(--gold-foil);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .action-btn:hover {
      background: var(--gold-foil);
      border-color: transparent;
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(242, 201, 76, 0.4);
    }

    .action-btn:hover span, .action-btn:hover i {
      -webkit-text-fill-color: #030712;
      color: #030712;
    }

    .action-btn:hover .btn-icon {
      background: rgba(3, 7, 18, 0.15);
      border-color: transparent;
    }

    .section-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2.5px;
      margin-bottom: 12px;
      text-align: left;
      padding-left: 4px;
    }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
      margin-bottom: 24px;
    }

    .social-icon-btn {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 14px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 15px;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .social-icon-btn i {
      color: var(--gold-primary);
      transition: color 0.3s ease;
    }

    .social-icon-btn:hover {
      background: var(--gold-foil);
      border-color: transparent;
      transform: translateY(-4px) scale(1.08);
      box-shadow: 0 8px 20px rgba(242, 201, 76, 0.35);
    }

    .social-icon-btn:hover i {
      color: #030712;
    }

    /* VIP Quick Lead Box */
    .vip-lead-box {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 22px;
      text-align: left;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .vip-lead-box h4 {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .vip-lead-input {
      width: 100%;
      background: #030712;
      border: 1px solid rgba(242, 201, 76, 0.3);
      border-radius: 12px;
      padding: 10px 12px;
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 8px;
      outline: none;
      transition: border-color 0.2s;
    }

    .vip-lead-input:focus {
      border-color: var(--gold-primary);
    }

    .vip-lead-btn {
      width: 100%;
      background: var(--gold-foil);
      color: #030712;
      border: none;
      border-radius: 12px;
      padding: 11px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .vip-lead-btn:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }

    /* Modern Portals List */
    .multimedia-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 22px;
    }

    .portal-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 13px 18px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--glass-border);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .portal-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .portal-left i {
      font-size: 16px;
      color: var(--gold-primary);
    }

    .portal-left span {
      background: var(--gold-foil);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .portal-link:hover {
      background: rgba(242, 201, 76, 0.08);
      border-color: var(--gold-primary);
      transform: translateX(5px);
    }

    /* QR Code Card */
    .qr-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px;
      border-radius: 20px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--glass-border);
      margin-bottom: 20px;
      text-align: left;
    }

    .qr-frame {
      width: 70px;
      height: 70px;
      background: #ffffff;
      padding: 5px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
    }

    .qr-frame img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .qr-details h4 {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .qr-details p {
      font-size: 11px;
      color: var(--gold-primary);
      opacity: 0.85;
      line-height: 1.4;
    }

    /* Save Contact Button */
    .btn-save-vcard {
      width: 100%;
      padding: 15px;
      border-radius: 16px;
      border: none;
      background: var(--gold-foil);
      color: #030712;
      font-family: 'Cinzel', serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 10px 30px rgba(184, 134, 11, 0.45);
      transition: all 0.3s ease;
    }

    .btn-save-vcard:hover {
      filter: brightness(1.12);
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 15px 35px rgba(242, 201, 76, 0.6);
    }
  </style>
</head>

  <script>
    const CRM_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbyTd5S6F6l7X9555Hawy6PMAr0WixSXQz1sQ-fqiBQwzPQuF_Z7aZrlvHerzv6ZJBE4/exec';

    let fallbackIndex = 0;
    const backupPaths = ['logo.png', 'logo.png.png', '1785795993842_2.jpg', '1785795993842.jpg'];

    function loadBackupLogos(imgElement) {
      if (fallbackIndex < backupPaths.length) {
        imgElement.src = backupPaths[fallbackIndex];
        fallbackIndex++;
      }
    }

    /* SILENT DIGITAL CARD RADAR: Automatically notifies CRM that card was viewed */
    function trackCardImpression() {
      try {
        const payload = {
          id: Date.now(),
          name: 'Digital Card Visitor',
          phone: 'N/A (Card Tap)',
          email: 'bintahacrm@gmail.com',
          subject: 'NFC/Web Digital Card Viewed',
          text: `Visitor accessed Digital Card. Screen: ${window.screen.width}x${window.screen.height}, Time: ${new Date().toLocaleTimeString()}`,
          time: new Date().toLocaleTimeString()
        };

        fetch(CRM_WEBHOOK_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(() => {});
      } catch(e) {}
    }

    /* Track Button Interactions */
    function trackInteraction(actionName) {
      try {
        const payload = {
          id: Date.now(),
          name: 'Card User',
          phone: 'N/A',
          email: 'bintahacrm@gmail.com',
          subject: `Digital Card: ${actionName}`,
          text: `User triggered action: ${actionName}`,
          time: new Date().toLocaleTimeString()
        };

        fetch(CRM_WEBHOOK_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).catch(() => {});
      } catch(e) {}
    }

    /* VIP Lead Submission */
    function submitCardInquiry() {
      const name = document.getElementById('cardVisitorName').value.trim();
      const phone = document.getElementById('cardVisitorPhone').value.trim();

      if (!name || !phone) {
        alert('Please enter both your Name and Phone / WhatsApp number!');
        return;
      }

      const payload = {
        id: Date.now(),
        name: name,
        phone: phone,
        email: 'bintahacrm@gmail.com',
        subject: 'Direct Inquiry via Digital Card',
        text: `Inquiry from Digital Card. Name: ${name}, Phone: ${phone}`,
        time: new Date().toLocaleTimeString()
      };

      fetch(CRM_WEBHOOK_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(() => {
        alert('✅ Thank you! Your inquiry has been dispatched directly to CEO Taha Mobeen Bhutta.');
        document.getElementById('cardVisitorName').value = '';
        document.getElementById('cardVisitorPhone').value = '';
      }).catch(() => {
        alert('✅ Inquiry dispatched!');
      });
    }

    /* Download VCard with Tracking */
    function saveVCard() {
      trackInteraction('Saved Contact VCF');

      const vCardData = 
`BEGIN:VCARD
VERSION:3.0
N:Bhutta;Taha;Mobeen;;
FN:Taha Mobeen Bhutta
ORG:Bin Taha Associates
TITLE:Chief Executive Officer - Real Estate & Civil Construction
TEL;TYPE=CELL,VOICE:+923219404812
TEL;TYPE=WHATSAPP,VOICE:+923219404812
EMAIL;TYPE=PREF,INTERNET:bintahacrm@gmail.com
URL:https://bintahaassociates.github.io/app/
NOTE:Bin Taha Associates - Premium Real Estate, Civil Construction & Advisory Services, Lahore
END:VCARD`;

      const blob = new Blob([vCardData], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const downloadLink = document.createElement('a');
      downloadLink.href = url;
      downloadLink.setAttribute('download', 'Taha_Mobeen_Bhutta_Bin_Taha_Associates.vcf');
      document.body.appendChild(downloadLink);
      downloadLink.click();
      document.body.removeChild(downloadLink);
    }

    // Run silent tracker on load
    window.addEventListener('DOMContentLoaded', trackCardImpression);
  </script>
</body>
